<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPad to PC Stream</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; background: #0f1115; color: #e6e8ec;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 20px; gap: 16px;
    }
    .card {
      background: #1a1d24; border: 1px solid #2b303b; border-radius: 12px;
      padding: 20px; width: 100%; max-width: 480px; text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 1.3rem; }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
    button {
      background: #3b82f6; color: white; border: none; border-radius: 8px;
      padding: 10px 16px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: #2b303b; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input {
      background: #0f1115; color: white; border: 1px solid #3a4150;
      border-radius: 8px; padding: 12px; font-size: 1.1rem;
      text-align: center; width: 140px; letter-spacing: 3px;
    }
    .code {
      font-size: 2.2rem; font-weight: 800; letter-spacing: 6px;
      color: #60a5fa; margin: 10px 0;
    }
    #rxStatus, #txStatus { font-size: 0.9rem; color: #9ca3af; margin-top: 10px; }

    /* Wrapper keeps rotation intact in fullscreen and prevents clipping */
    #videoWrap {
      display: none;
      width: 100%;
      max-width: 1280px;
      height: 75vh;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      align-items: center;
      justify-content: center;
    }
    #videoWrap:fullscreen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      border-radius: 0;
    }
    video {
      object-fit: contain;
      transition: transform 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="card" id="menu">
    <h1>iPad → PC Screen Stream</h1>
    <div class="row">
      <button onclick="startReceiver()">I'm on PC (Receive)</button>
      <button class="secondary" onclick="showSender()">I'm on iPad (Send)</button>
    </div>
  </div>

  <!-- PC Receiver UI -->
  <div class="card" id="receiverBox" style="display:none;">
    <h1>PC Receiver</h1>
    <div>Enter this code on your iPad Stupid:</div>
    <div class="code" id="roomCode">----</div>
    <div class="row">
      <button class="secondary" onclick="toggleFullscreen()">Fullscreen</button>
      <button class="secondary" onclick="rotateManual()">Rotate 90°</button>
      <button class="secondary" id="autoRotateBtn" onclick="toggleAutoRotate()">Auto-Rotate: ON</button>
    </div>
    <div id="rxStatus">Connecting to signaling server...</div>
  </div>

  <!-- iPad Sender UI -->
  <div class="card" id="senderBox" style="display:none;">
    <h1>iPad Sender</h1>
    <div class="row">
      <input id="codeInput" type="number" placeholder="1234" maxlength="4" />
      <button id="shareBtn" onclick="startSharing()">Share Screen</button>
    </div>
    <div id="txStatus">Enter the 4-digit code from your PC.</div>
  </div>

  <div id="videoWrap">
    <video id="remoteVideo" autoplay playsinline muted></video>
  </div>

  <script>
    const PREFIX = "ipadstream-";
    const ICE_CONFIG = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    };

    let peer = null;
    let dataConn = null;
    let currentAngle = 0;
    let autoRotate = true;

    // --- Video rotation & scaling (PC side) ---
    function applyRotation() {
      const wrap = document.getElementById("videoWrap");
      const video = document.getElementById("remoteVideo");
      const angle = ((currentAngle % 360) + 360) % 360;

      video.style.transform = `rotate(${angle}deg)`;

      // Swap video box dimensions when rotated 90 or 270 deg so it fills the container
      if (angle === 90 || angle === 270) {
        video.style.width = wrap.clientHeight + "px";
        video.style.height = wrap.clientWidth + "px";
      } else {
        video.style.width = "100%";
        video.style.height = "100%";
      }
    }

    function rotateManual() {
      autoRotate = false;
      document.getElementById("autoRotateBtn").textContent = "Auto-Rotate: OFF";
      currentAngle = (currentAngle + 90) % 360;
      applyRotation();
    }

    function toggleAutoRotate() {
      autoRotate = !autoRotate;
      document.getElementById("autoRotateBtn").textContent =
        "Auto-Rotate: " + (autoRotate ? "ON" : "OFF");
    }

    // Re-fit rotated video whenever window resizes or fullscreen toggles
    new ResizeObserver(applyRotation).observe(document.getElementById("videoWrap"));

    // --- PC Receiver ---
    function startReceiver() {
      document.getElementById("menu").style.display = "none";
      document.getElementById("receiverBox").style.display = "block";

      const code = Math.floor(1000 + Math.random() * 9000).toString();
      peer = new Peer(PREFIX + code, { config: ICE_CONFIG });

      peer.on("open", () => {
        document.getElementById("roomCode").textContent = code;
        document.getElementById("rxStatus").textContent = "Waiting for iPad...";
      });

      // Listen for orientation updates from iPad
      peer.on("connection", (conn) => {
        dataConn = conn;
        conn.on("data", (msg) => {
          if (msg && msg.type === "orientation" && autoRotate) {
            currentAngle = msg.angle;
            applyRotation();
          }
        });
      });

      // Listen for video stream from iPad
      peer.on("call", (call) => {
        document.getElementById("rxStatus").textContent = "Incoming stream...";
        call.answer();

        call.on("stream", (remoteStream) => {
          const wrap = document.getElementById("videoWrap");
          const video = document.getElementById("remoteVideo");
          video.srcObject = remoteStream;
          wrap.style.display = "flex";
          applyRotation();
          video.play().catch(() => {});
          document.getElementById("rxStatus").textContent = "Connected! Streaming live.";
        });

        call.on("close", () => {
          document.getElementById("rxStatus").textContent = "Stream ended.";
        });
      });

      peer.on("error", (err) => {
        document.getElementById("rxStatus").textContent = "Error: " + err.type;
      });
    }

    // --- iPad Sender ---
    function showSender() {
      document.getElementById("menu").style.display = "none";
      document.getElementById("senderBox").style.display = "block";
    }

    function getOrientationAngle() {
      if (screen.orientation && typeof screen.orientation.angle === "number") {
        return screen.orientation.angle;
      }
      if (typeof window.orientation === "number") {
        return window.orientation;
      }
      return window.innerWidth > window.innerHeight ? 90 : 0;
    }

    function sendOrientation() {
      if (dataConn && dataConn.open) {
        dataConn.send({ type: "orientation", angle: getOrientationAngle() });
      }
    }

    async function startSharing() {
      const code = document.getElementById("codeInput").value.trim();
      const status = document.getElementById("txStatus");
      if (code.length !== 4) {
        status.textContent = "Please enter the 4-digit code from your PC.";
        return;
      }

      try {
        status.textContent = "Opening iPad screen picker...";
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 60, max: 60 } },
          audio: false
        });

        status.textContent = "Connecting to PC...";
        peer = new Peer({ config: ICE_CONFIG });

        peer.on("open", () => {
          // Open data channel for orientation sync
          dataConn = peer.connect(PREFIX + code);
          dataConn.on("open", () => {
            sendOrientation();
          });

          // Send updates whenever the iPad rotates
          if (screen.orientation) {
            screen.orientation.addEventListener("change", sendOrientation);
          }
          window.addEventListener("orientationchange", sendOrientation);
          window.addEventListener("resize", sendOrientation);

          // Start video call
          const call = peer.call(PREFIX + code, stream);
          status.textContent = "Streaming to PC!";

          stream.getVideoTracks()[0].onended = () => {
            call.close();
            if (dataConn) dataConn.close();
            status.textContent = "Screen sharing stopped.";
          };
        });

        peer.on("error", (err) => {
          status.textContent = "Error: " + err.type;
        });
      } catch (err) {
        status.textContent = "Capture failed: " + err.message;
      }
    }

    function toggleFullscreen() {
      const wrap = document.getElementById("videoWrap");
      if (!document.fullscreenElement) {
        if (wrap.requestFullscreen) wrap.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
